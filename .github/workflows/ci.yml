name: Support site CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate support site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate source and run tests
        run: npm run ci
